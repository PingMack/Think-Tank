[project]
name = "ai_0119_rag"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.1",
    "grandalf>=0.8",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.11",
    "loguru>=0.7.3",
    "magic-pdf>=1.3.12",
    "mineru-kie-sdk>=0.1.1",
    "minio>=7.2.20",
    "modelscope>=1.35.1",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pymilvus[model]>=2.6.10",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.16.0",
    "python-multipart>=0.0.22",
    "regex>=2026.2.28",
    "flagembedding>=1.3.5",      # 👈 这里去掉了 v
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
    "uvicorn>=0.42.0",
    "transformers>=4.57.6",
    "datasets>=4.8.4",
    "openai-agents>=0.4.2",
    "requests>=2.32.5",
    "langchain-mcp-adapters>=0.2.2",
    "dashscope>=1.25.17",
    "python-dotenv>=1.2.2",
    "langgraph>=1.1.3",
]

# ==========================================
# uv 的配置
# ==========================================

# 1. 默认使用清华源（加速下载）
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 2. 指定 PyTorch 的 CUDA 源
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# 3. 强制 torch 相关的包去 pytorch-cuda 源下载
[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }